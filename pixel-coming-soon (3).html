<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pixel — Скоро на экранах!</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-top: #EAF6FF;
    --bg-bottom: #FFFFFF;
    --ink: #2B2440;
    --ink-soft: #6E6684;
    --coral: #FF6F59;
    --teal: #2EC4B6;
    --yellow: #FFC43D;
    --purple: #6C5CE7;
    --card-bg: #FFF6E9;
    --hairline: rgba(43,36,64,0.10);
  }

  *{ box-sizing: border-box; }

  @media (prefers-reduced-motion: reduce){
    *{ animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; transition-duration: 0.01ms !important; }
  }

  html, body{
    margin:0;
    padding:0;
    color: var(--ink);
    font-family: 'Nunito', sans-serif;
  }

  body{
    display:flex;
    flex-direction:column;
    min-height:100vh;
    overflow-x:hidden;
    position:relative;
    background: linear-gradient(180deg, var(--bg-top) 0%, var(--bg-bottom) 65%);
  }

  a{ color:inherit; text-decoration:none; }
  a:focus-visible, button:focus-visible{
    outline: 3px solid var(--purple);
    outline-offset: 3px;
    border-radius: 6px;
  }

  /* ---------- clouds + rainbows background ---------- */
  .sky-layer{
    position: fixed;
    inset: 0;
    z-index: 0;
    overflow: hidden;
    pointer-events: none;
  }

  .cloud-rainbow{
    position:absolute;
    opacity: 0.85;
  }
  .cloud-rainbow svg{ display:block; width:100%; height:100%; }

  .cr-tl{ top: -6%; left: -8%; width: 46vw; max-width: 560px; min-width: 340px; }
  .cr-br{ bottom: -10%; right: -10%; width: 50vw; max-width: 600px; min-width: 360px; transform: scaleX(-1) rotate(4deg); opacity: 0.75; }
  .cr-tr{ top: 2%; right: -6%; width: 26vw; max-width: 320px; min-width: 200px; opacity: 0.5; }

  /* ---------- header ---------- */
  header{
    padding: 36px 0 0;
    display:flex;
    justify-content:center;
    position:relative;
    z-index:1;
  }
  .logo{
    font-family: 'Baloo 2', sans-serif;
    font-size: 26px;
    font-weight: 800;
    color: var(--ink);
  }
  .logo span{ color: var(--coral); }

  .wrap{
    width:100%;
    max-width: 1100px;
    margin: 0 auto;
    padding: 0 28px;
    flex:1;
    display:flex;
    flex-direction:column;
    position:relative;
    z-index:1;
  }

  /* ---------- hero ---------- */
  .hero{
    flex:1;
    display:flex;
    align-items:center;
    justify-content:center;
    padding: 40px 0 56px;
  }

  .hero-content{
    display:flex;
    flex-direction:column;
    align-items:center;
    text-align:center;
    gap: 28px;
    max-width: 680px;
  }

  .badge{
    display:inline-flex;
    align-items:center;
    gap: 8px;
    background: rgba(255,255,255,0.85);
    backdrop-filter: blur(4px);
    border-radius: 999px;
    padding: 8px 18px;
    font-weight: 700;
    font-size: 14px;
    color: var(--ink-soft);
  }
  .badge .dot{
    width:8px; height:8px; border-radius:50%;
    background: var(--coral);
    animation: pulse 1.8s ease-in-out infinite;
  }
  @keyframes pulse{
    0%, 100%{ opacity: 1; }
    50%{ opacity: 0.3; }
  }

  h1{
    margin:0;
    font-family: 'Baloo 2', sans-serif;
    font-weight: 800;
    font-size: clamp(52px, 9vw, 104px);
    line-height: 1;
    color: var(--coral);
  }

  .sub{
    max-width: 42ch;
    color: var(--ink-soft);
    font-size: 18px;
    line-height: 1.6;
    font-weight: 700;
    background: rgba(255,255,255,0.6);
    padding: 6px 14px;
    border-radius: 14px;
  }

  /* ---------- countdown ---------- */
  .timer{
    display:flex;
    justify-content:center;
    flex-wrap: wrap;
    gap: 16px;
    margin-top: 8px;
  }

  .timer-unit{
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    width: clamp(72px, 18vw, 104px);
    height: clamp(72px, 18vw, 104px);
    border-radius: 22px;
    background: var(--card-bg);
    box-shadow: 0 6px 18px rgba(43,36,64,0.08);
  }
  .timer-unit:nth-child(1){ background: #FFE8E3; }
  .timer-unit:nth-child(2){ background: #E4FBF8; }
  .timer-unit:nth-child(3){ background: #FFF3D6; }
  .timer-unit:nth-child(4){ background: #EFEBFF; }

  .timer-num{
    font-family: 'Baloo 2', sans-serif;
    font-weight: 800;
    font-size: clamp(28px, 5vw, 42px);
    color: var(--ink);
    font-variant-numeric: tabular-nums;
    line-height: 1;
  }

  .timer-label{
    margin-top: 6px;
    font-size: 12px;
    font-weight: 700;
    color: var(--ink-soft);
  }

  /* ---------- footer ---------- */
  footer{
    border-top: 2px solid var(--hairline);
    padding: 26px 0 34px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    flex-wrap: wrap;
    gap: 16px;
    position:relative;
    z-index:1;
    background: rgba(255,255,255,0.55);
    backdrop-filter: blur(3px);
  }

  .footer-note{
    font-size: 14px;
    font-weight: 700;
    color: var(--ink-soft);
  }

  .social-links{
    display:flex;
    gap: 12px;
  }

  .social-links a{
    display:flex;
    align-items:center;
    gap: 8px;
    font-size: 14px;
    font-weight: 700;
    color: var(--ink);
    background: #FFFFFF;
    padding: 10px 16px;
    border-radius: 999px;
    transition: transform 0.15s ease, background 0.15s ease;
  }
  .social-links a:hover{
    transform: translateY(-2px);
    background: #FFE8E3;
  }
  .social-links svg{
    width: 16px;
    height: 16px;
    stroke: currentColor;
    fill: none;
  }

  /* ---------- responsive ---------- */
  @media (max-width: 860px){
    .hero{ padding: 20px 0 44px; }
    footer{ justify-content:center; text-align:center; }
    .cr-tl{ width: 70vw; }
    .cr-br{ width: 75vw; }
    .cr-tr{ display:none; }
  }

  @media (max-width: 420px){
    .wrap{ padding: 0 18px; }
    .timer{ gap: 10px; }
  }
</style>
</head>
<body>

<div class="sky-layer" aria-hidden="true">
  <div class="cloud-rainbow cr-tl">
    <svg viewBox="0 0 340 220" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="fadeTL" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#fff" stop-opacity="1"/>
          <stop offset="75%" stop-color="#fff" stop-opacity="0.15"/>
          <stop offset="100%" stop-color="#fff" stop-opacity="0"/>
        </linearGradient>
        <mask id="maskTL">
          <rect x="0" y="0" width="340" height="220" fill="url(#fadeTL)"/>
        </mask>
      </defs>
      <g mask="url(#maskTL)">
        <path d="M60,95 Q160,60 320,205" stroke="#FF6B6B" stroke-width="15" fill="none" stroke-linecap="round"/>
        <path d="M60,98 Q160,63 320,208" stroke="#FFA94D" stroke-width="15" fill="none" stroke-linecap="round"/>
        <path d="M60,101 Q160,66 320,211" stroke="#FFD43B" stroke-width="15" fill="none" stroke-linecap="round"/>
        <path d="M60,104 Q160,69 320,214" stroke="#69DB7C" stroke-width="15" fill="none" stroke-linecap="round"/>
        <path d="M60,107 Q160,72 320,217" stroke="#4DABF7" stroke-width="15" fill="none" stroke-linecap="round"/>
        <path d="M60,110 Q160,75 320,220" stroke="#B197FC" stroke-width="15" fill="none" stroke-linecap="round"/>
      </g>
      <g>
        <ellipse cx="40" cy="92" rx="40" ry="29" fill="#FFFFFF"/>
        <ellipse cx="100" cy="97" rx="50" ry="31" fill="#FFFFFF"/>
        <ellipse cx="70" cy="70" rx="54" ry="37" fill="#FFFFFF"/>
        <ellipse cx="115" cy="56" rx="44" ry="33" fill="#FFFFFF"/>
      </g>
    </svg>
  </div>

  <div class="cloud-rainbow cr-br">
    <svg viewBox="0 0 340 220" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="fadeBR" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#fff" stop-opacity="1"/>
          <stop offset="75%" stop-color="#fff" stop-opacity="0.15"/>
          <stop offset="100%" stop-color="#fff" stop-opacity="0"/>
        </linearGradient>
        <mask id="maskBR">
          <rect x="0" y="0" width="340" height="220" fill="url(#fadeBR)"/>
        </mask>
      </defs>
      <g mask="url(#maskBR)">
        <path d="M60,95 Q160,60 320,205" stroke="#FF6B6B" stroke-width="15" fill="none" stroke-linecap="round"/>
        <path d="M60,98 Q160,63 320,208" stroke="#FFA94D" stroke-width="15" fill="none" stroke-linecap="round"/>
        <path d="M60,101 Q160,66 320,211" stroke="#FFD43B" stroke-width="15" fill="none" stroke-linecap="round"/>
        <path d="M60,104 Q160,69 320,214" stroke="#69DB7C" stroke-width="15" fill="none" stroke-linecap="round"/>
        <path d="M60,107 Q160,72 320,217" stroke="#4DABF7" stroke-width="15" fill="none" stroke-linecap="round"/>
        <path d="M60,110 Q160,75 320,220" stroke="#B197FC" stroke-width="15" fill="none" stroke-linecap="round"/>
      </g>
      <g>
        <ellipse cx="40" cy="92" rx="40" ry="29" fill="#FFFFFF"/>
        <ellipse cx="100" cy="97" rx="50" ry="31" fill="#FFFFFF"/>
        <ellipse cx="70" cy="70" rx="54" ry="37" fill="#FFFFFF"/>
        <ellipse cx="115" cy="56" rx="44" ry="33" fill="#FFFFFF"/>
      </g>
    </svg>
  </div>

  <div class="cloud-rainbow cr-tr">
    <svg viewBox="0 0 340 220" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="fadeTR" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#fff" stop-opacity="1"/>
          <stop offset="75%" stop-color="#fff" stop-opacity="0.15"/>
          <stop offset="100%" stop-color="#fff" stop-opacity="0"/>
        </linearGradient>
        <mask id="maskTR">
          <rect x="0" y="0" width="340" height="220" fill="url(#fadeTR)"/>
        </mask>
      </defs>
      <g mask="url(#maskTR)">
        <path d="M60,95 Q160,60 320,205" stroke="#FF6B6B" stroke-width="15" fill="none" stroke-linecap="round"/>
        <path d="M60,98 Q160,63 320,208" stroke="#FFA94D" stroke-width="15" fill="none" stroke-linecap="round"/>
        <path d="M60,101 Q160,66 320,211" stroke="#FFD43B" stroke-width="15" fill="none" stroke-linecap="round"/>
        <path d="M60,104 Q160,69 320,214" stroke="#69DB7C" stroke-width="15" fill="none" stroke-linecap="round"/>
        <path d="M60,107 Q160,72 320,217" stroke="#4DABF7" stroke-width="15" fill="none" stroke-linecap="round"/>
        <path d="M60,110 Q160,75 320,220" stroke="#B197FC" stroke-width="15" fill="none" stroke-linecap="round"/>
      </g>
      <g>
        <ellipse cx="40" cy="92" rx="40" ry="29" fill="#FFFFFF"/>
        <ellipse cx="100" cy="97" rx="50" ry="31" fill="#FFFFFF"/>
        <ellipse cx="70" cy="70" rx="54" ry="37" fill="#FFFFFF"/>
        <ellipse cx="115" cy="56" rx="44" ry="33" fill="#FFFFFF"/>
      </g>
    </svg>
  </div>
</div>

<div class="wrap">

  <header>
    <div class="logo">Pi<span>x</span>el</div>
  </header>

  <div class="hero">
    <div class="hero-content">
      <div class="badge">
        <span class="dot"></span>
        <span>детский телеканал</span>
      </div>

      <h1>Скоро&hellip;</h1>

      <p class="sub">Мы готовим запуск детского интернет-телеканала Pixel — совсем скоро на экранах! Следите за нами в соцсетях.</p>

      <div class="timer" aria-live="polite">
        <div class="timer-unit">
          <span class="timer-num" id="t-days">00</span>
          <span class="timer-label">дней</span>
        </div>
        <div class="timer-unit">
          <span class="timer-num" id="t-hours">00</span>
          <span class="timer-label">часов</span>
        </div>
        <div class="timer-unit">
          <span class="timer-num" id="t-mins">00</span>
          <span class="timer-label">минут</span>
        </div>
        <div class="timer-unit">
          <span class="timer-num" id="t-secs">00</span>
          <span class="timer-label">секунд</span>
        </div>
      </div>
    </div>
  </div>

  <footer>
    <span class="footer-note">Pixel &copy; 2026</span>

    <div class="social-links">
      <a href="https://vk.ru/club241465834" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24" stroke-width="1.8"><rect x="3" y="3" width="18" height="18" rx="4"/><path d="M8 8v8M16 8v8M8 12h8"/></svg>
        VK
      </a>
      <a href="https://www.twitch.tv/pixeltvmult" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24" stroke-width="1.8"><path d="M6 4h12v9a4 4 0 0 1-4 4h-2l-4 3v-3H6z"/><path d="M15 8v3M11 8v3"/></svg>
        Twitch
      </a>
      <a href="https://t.me/+nCs6ofnlTAMzMDdi" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24" stroke-width="1.8"><path d="M21 4 2.5 11.3c-.9.35-.9 1.6.02 1.93l4.6 1.63 1.7 5.4c.24.76 1.2.98 1.76.4l2.6-2.7 4.8 3.55c.7.5 1.7.1 1.86-.76L22 4.9c.14-.75-.6-1.35-1-.9Z"/><path d="M8.2 13.9 18 6.5"/></svg>
        Telegram
      </a>
    </div>
  </footer>

</div>

<script>
  // Отсчёт 60 дней — фиксированная дата запуска
  var target = new Date('2026-11-11T00:00:00');

  var elDays = document.getElementById('t-days');
  var elHours = document.getElementById('t-hours');
  var elMins = document.getElementById('t-mins');
  var elSecs = document.getElementById('t-secs');

  function pad(n){ return String(n).padStart(2, '0'); }

  function tick(){
    var now = new Date();
    var diff = target - now;
    if (diff < 0) diff = 0;

    var days = Math.floor(diff / 86400000);
    var hours = Math.floor((diff % 86400000) / 3600000);
    var mins = Math.floor((diff % 3600000) / 60000);
    var secs = Math.floor((diff % 60000) / 1000);

    elDays.textContent = pad(days);
    elHours.textContent = pad(hours);
    elMins.textContent = pad(mins);
    elSecs.textContent = pad(secs);
  }

  tick();
  setInterval(tick, 1000);
</script>

</body>
</html>
